# One command demo:  docker compose up --build   →  http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchtower
      POSTGRES_PASSWORD: watchtower
      POSTGRES_DB: watchtower
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U watchtower']
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ['4000:4000']
    environment:
      NODE_ENV: production
      ROLE: all
      DATABASE_URL: postgresql://watchtower:watchtower@db:5432/watchtower
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-please-change-this-demo-secret-0123456789abcdef}
      APP_URL: http://localhost:4000
      DEMO_MODE: 'true'
      DEMO_SITE_ORIGIN: http://localhost:4000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Watchtower AI <alerts@example.com>}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: ['storage:/app/apps/server/storage']
    shm_size: 1gb

volumes:
  pgdata:
  storage:
